<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>핫도그 서바이벌</title>
<meta name="description" content="썩은 과일들이 노점으로 몰려온다! 소스를 뽑아 장착하고 끝까지 살아남는 핫도그 서바이벌 게임">
<meta property="og:type" content="website">
<meta property="og:title" content="핫도그 서바이벌">
<meta property="og:description" content="썩은 과일들이 노점으로 몰려온다! 소스를 뽑아 장착하고 끝까지 살아남는 핫도그 서바이벌 게임">
<meta name="theme-color" content="#241A33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#241A33; --plum2:#2E2242; --plum3:#3B2D55; --plum4:#4A3968;
  --ink:#FFF3E6; --ink2:#D7C4D3; --ink3:#A08DA3;
  --mus:#F6B93B; --mus2:#FFD36B; --musd:#C98A1E; --ket:#E5484D; --bun:#F2B266; --pickle:#7CC67A;
  --line:rgba(255,243,230,.11);
  --r0:#A9B4C2; --r1:#4DA8FF; --r2:#B76DFF; --r3:#FFB627;
  --font:"Jua","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --font-b:"Gowun Dodum","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  height:100%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--plum:#241A33;--plum2:#2E2242;--plum3:#3B2D55;--ink:#FFF3E6;--ink2:#D7C4D3;}
}
:root[data-theme="dark"]{--plum:#241A33;--plum2:#2E2242;--plum3:#3B2D55;--ink:#FFF3E6;--ink2:#D7C4D3;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
body{background:var(--plum);color:var(--ink);font-family:var(--font);font-synthesis:none;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;}
*,*::before,*::after{box-sizing:border-box;}
#app{position:relative;width:100%;height:100%;overflow:hidden;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
.hide{display:none!important;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;}
button:focus-visible{outline:3px solid var(--mus2);outline-offset:3px;}
kbd{font:11px var(--font);padding:2px 6px;border-radius:6px;background:var(--plum4);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.3);}

/* buttons */
.btn{position:relative;font-weight:800;font-size:16px;letter-spacing:-.01em;padding:14px 20px;border-radius:18px;transition:transform .12s ease,filter .12s ease;white-space:nowrap;}
.btn:active{transform:translateY(2px) scale(.98);}
.btn.primary{background:var(--mus);color:#3A220B;box-shadow:0 5px 0 var(--musd),0 14px 26px rgba(0,0,0,.35);font-size:19px;padding:17px 34px;border-radius:22px;}
.btn.primary::after{content:"";position:absolute;left:16px;right:16px;top:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.38);pointer-events:none;}
.btn.ghost{background:rgba(36,26,51,.62);border:1.5px solid rgba(255,243,230,.18);color:var(--ink);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.btn.dis{opacity:.45;pointer-events:none;}
.iconbtn{width:42px;height:42px;border-radius:50%;background:rgba(36,26,51,.62);border:1.5px solid var(--line);display:grid;place-items:center;}
.iconbtn svg{width:20px;height:20px;}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 7px;border-radius:999px;background:rgba(36,26,51,.66);border:1.5px solid var(--line);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;}
.pill svg{width:22px;height:22px;}

/* lobby */
#lobby{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding:14px 16px 16px;pointer-events:none;}
#lobby > *{pointer-events:auto;}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;}
.title{width:min(540px,92%,74vh);margin-top:clamp(2px,2.4vh,22px);text-align:center;}
.title svg{animation:logoFloat 4.6s ease-in-out infinite;}
.title .lg-t{font-family:"Luckiest Guy","Jua","Pretendard",system-ui,sans-serif;}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.title svg{width:100%;height:auto;display:block;overflow:visible;}
.title p{margin:-2px 0 0;font-size:15px;color:var(--ink2);letter-spacing:.04em;}
#stage{flex:1;width:100%;min-height:140px;pointer-events:none!important;}
.loadout{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;align-items:stretch;}
.lgrp{display:flex;gap:2px;padding:3px;border-radius:19px;background:rgba(36,26,51,.66);border:1.5px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .3s,box-shadow .3s;}
.lgrp.dog.on{border-color:var(--sc);box-shadow:inset 0 0 0 1px var(--sc),0 0 18px color-mix(in srgb,var(--sc) 42%,transparent);}
.slot{display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;padding:4px 2px 5px;border-radius:15px;text-align:center;transition:background .15s,transform .12s;}
.slot:hover{background:rgba(255,243,230,.07);}
.slot:active{transform:scale(.95);}
.slot img{width:40px;height:40px;border-radius:50%;background:rgba(255,243,230,.07);flex:none;}
.slot small{font-size:10.5px;color:var(--ink3);font-weight:800;line-height:1.25;margin-top:1px;}
.slot b{font-size:11px;font-weight:800;max-width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;}
@media (min-width:700px){.slot{width:84px}.slot b{max-width:80px;font-size:11.5px}.slot img{width:44px;height:44px}}
.setchip{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(36,26,51,.66);border:1.5px solid var(--line);max-width:94%;font-weight:800;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .12s;}
.setchip:active{transform:scale(.97);}
.setchip img{width:32px;height:32px;flex:none;}
.setchip span{display:flex;flex-direction:column;text-align:left;line-height:1.22;min-width:0;}
.setchip small{font-size:10.5px;color:var(--sc);font-weight:900;}
.setchip b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.setchip .go{font-style:normal;font-size:18px;color:var(--ink3);margin-left:2px;line-height:1;}
.setchip .hint2{font-size:12px;color:var(--ink3);padding:5px 0 5px 10px;font-weight:700;}
.setchip .hint2 b{font-size:12px;color:var(--mus2);display:inline;}
.setchip.on{border-color:var(--sc);animation:chipGlow 2.8s ease-in-out infinite;}
@keyframes chipGlow{0%,100%{box-shadow:0 0 12px color-mix(in srgb,var(--sc) 30%,transparent)}50%{box-shadow:0 0 24px color-mix(in srgb,var(--sc) 62%,transparent)}}
.actions{display:flex;gap:10px;align-items:center;}
.best{margin:12px 0 0;font-size:13px;color:var(--ink3);font-weight:700;}

/* sheets */
.sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(14,9,22,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s ease;}
.sheet .card{width:min(800px,100%);height:min(92%,840px);background:var(--plum2);border-radius:28px 28px 0 0;border:1.5px solid var(--line);border-bottom:0;display:flex;flex-direction:column;animation:up .34s cubic-bezier(.2,.9,.25,1.04);box-shadow:0 -12px 40px rgba(0,0,0,.45);overflow:hidden;}
@media (min-width:860px) and (min-height:640px){.sheet{align-items:center}.sheet .card{border-radius:28px;border-bottom:1.5px solid var(--line);height:min(88%,780px)}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 12px;}
.sh-head h2{margin:0;font-size:23px;font-weight:900;letter-spacing:-.03em;}
.sh-head .r{display:flex;gap:8px;align-items:center;}
.tabs{display:flex;gap:4px;margin:0 20px 12px;padding:5px;background:rgba(0,0,0,.24);border-radius:17px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1 0 auto;min-width:50px;padding:9px 5px;border-radius:13px;font-weight:800;font-size:14px;color:var(--ink2);white-space:nowrap;}
@media (max-width:520px){.tab{font-size:12.5px;padding:8px 3px;}.tab small{font-size:10px;}}
.tab small{display:block;font-size:11px;font-weight:700;color:var(--ink3);margin-top:1px;font-variant-numeric:tabular-nums;}
.tab.on{background:var(--plum4);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25);}
.tab.on small{color:var(--mus2);}
.grid{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:2px 20px 26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start;}
.ic{position:relative;border-radius:18px;background:var(--plum3);padding:7px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;transition:transform .12s;}
.ic:active{transform:scale(.97);}
.ic .im{width:100%;aspect-ratio:1;border-radius:13px;display:grid;place-items:center;background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--rc) 38%,transparent),transparent 68%);}
.ic img{width:90%;height:90%;object-fit:contain;}
.ic .nm{font-size:12px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ic .st{font-size:10px;color:var(--mus);letter-spacing:1px;height:13px;font-weight:800;}
.ic .rb{position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--rc);}
.ic.eq{border-color:var(--mus);}
.ic.eq::after{content:"장착";position:absolute;top:6px;left:6px;font-size:10px;font-weight:900;background:var(--mus);color:#3A220B;padding:2px 7px;border-radius:999px;}
.ic.lock img{filter:grayscale(1) brightness(.62);opacity:.5;}
.ic.lock .nm{color:var(--ink3);}
.ic.lock .st{color:var(--ink3);letter-spacing:0;}
.ic .nw{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ket);box-shadow:0 0 0 2px var(--plum3);}

/* modal */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(14,9,22,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);padding:18px;animation:fade .18s ease;}
.dcard{width:min(390px,100%);max-height:100%;overflow-y:auto;touch-action:pan-y;background:var(--plum2);border-radius:26px;border:1.5px solid var(--line);animation:pop .3s cubic-bezier(.2,.9,.3,1.18);box-shadow:0 20px 50px rgba(0,0,0,.5);}
.dtop{position:relative;height:200px;display:grid;place-items:center;background:radial-gradient(circle at 50% 58%,color-mix(in srgb,var(--rc) 45%,transparent),transparent 62%),var(--plum3);border-radius:24px 24px 0 0;}
.dtop img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));}
.dtop .x{position:absolute;right:12px;top:12px;}
.dbody{padding:16px 20px 20px;}
.dname{font-size:23px;font-weight:900;letter-spacing:-.03em;margin:0;}
.tags{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap;align-items:center;}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,243,230,.08);color:var(--ink2);}
.tag.rar{background:var(--rc);color:#1A1224;}
.tag.star{background:none;color:var(--mus);padding:0 2px;letter-spacing:1px;}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.stat{font-size:13px;padding:7px 11px;border-radius:12px;background:rgba(0,0,0,.24);color:var(--ink2);font-weight:700;}
.stat b{color:var(--ink);margin-left:5px;font-variant-numeric:tabular-nums;}
.skill{padding:13px 15px;border-radius:17px;background:rgba(246,185,59,.08);border:1.5px solid rgba(246,185,59,.24);}
.skill .k{font-size:12px;font-weight:800;color:var(--mus);}
.skill h4{margin:3px 0 5px;font-size:17px;letter-spacing:-.02em;}
.skill p{margin:0;font-size:14px;line-height:1.65;color:var(--ink2);font-family:var(--font-b);}
.flav{font-size:13.5px;color:var(--ink3);margin:12px 2px 0;line-height:1.6;font-family:var(--font-b);}
.drow{display:flex;gap:8px;margin-top:16px;}
.drow .btn{flex:1;}

/* shop */
.shop-body{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:2px 20px 26px;display:flex;flex-direction:column;gap:14px;}
.mach{position:relative;border-radius:24px;padding:18px 18px 16px;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;}
.mach.sauce{background:linear-gradient(140deg,#FF7A4D,#E8402F 70%);color:#fff;}
.mach.ketchup{background:linear-gradient(140deg,#F25B6A,#B8283A 72%);color:#fff;}
.mach.mustard{background:linear-gradient(140deg,#FFD660,#EFA51A 72%);color:#3A220B;}
.mach::before{content:"";position:absolute;left:0;right:0;top:0;height:26px;background:
  radial-gradient(14px 18px at 12% 0,rgba(255,255,255,.22) 98%,transparent),
  radial-gradient(10px 26px at 34% 0,rgba(255,255,255,.22) 98%,transparent),
  radial-gradient(12px 14px at 52% 0,rgba(255,255,255,.22) 98%,transparent);pointer-events:none;}
.mach h3{margin:4px 0 0;font-size:23px;font-weight:900;letter-spacing:-.03em;}
.mach .sub{font-size:13px;font-weight:700;opacity:.86;margin-top:3px;word-break:keep-all;}
.mach .pv{position:absolute;right:10px;top:10px;height:116px;display:flex;align-items:flex-end;pointer-events:none;}
.mach .pv img{width:70px;height:70px;margin-left:-24px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25));}
.mach .pv img:nth-child(2){width:96px;height:96px;z-index:1;position:relative;}
.mach .row{display:flex;gap:8px;margin-top:20px;position:relative;z-index:2;}
.buy{flex:1;padding:11px 10px;border-radius:15px;background:rgba(255,255,255,.24);font-weight:900;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s;}
.buy:active{transform:scale(.97);}
.buy small{font-size:12px;font-weight:800;opacity:.92;display:flex;gap:4px;align-items:center;}
.buy small svg{width:14px;height:14px;}
.buy.dis{opacity:.45;}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.rate{text-align:center;padding:9px 4px;border-radius:13px;background:rgba(0,0,0,.22);font-size:12px;font-weight:700;color:var(--ink2);}
.rate b{display:block;font-size:15px;color:var(--rc);font-variant-numeric:tabular-nums;}
.note{font-size:12.5px;color:var(--ink3);line-height:1.6;margin:0 2px;font-family:var(--font-b);}

/* reveal */
#reveal{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:radial-gradient(circle at 50% 42%,rgba(74,48,108,.97),rgba(16,10,24,.98));animation:fade .2s ease;}
.rv-grid{display:grid;gap:10px;grid-template-columns:repeat(5,var(--cw));}
.rv-grid.one{grid-template-columns:var(--cw);}
.rc{perspective:900px;cursor:pointer;}
.rc .in{position:relative;width:100%;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.35,.5,1);}
.rc.open .in{transform:rotateY(180deg);}
.rc .f,.rc .b{position:absolute;inset:0;border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden;}
.rc .b{background:linear-gradient(160deg,var(--c1),var(--c2));display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.16),0 0 var(--gw) var(--glow);}
.rc .b svg{width:38%;opacity:.85;}
.rc.shake .in{animation:shk .5s ease-in-out infinite;}
.rc .f{transform:rotateY(180deg);background:var(--plum3);border:2px solid var(--rc);box-shadow:0 0 34px -6px var(--rc);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;gap:4px;text-align:center;}
.rc .f img{width:84%;flex:1;min-height:0;object-fit:contain;}
.rc .f b{font-size:12px;font-weight:900;line-height:1.25;letter-spacing:-.02em;}
.rc .f i{font-style:normal;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--rc);color:#1A1224;}
.rc .f em{font-style:normal;font-size:10px;font-weight:900;color:var(--mus2);}
.rv-grid.one .rc .f b{font-size:18px;}
.rv-grid.one .rc .f i,.rv-grid.one .rc .f em{font-size:12px;}
.rc.r3.open .f{animation:gold 1.6s ease-in-out infinite;}
.rv-btns{display:flex;gap:10px;}
.rv-title{font-size:15px;font-weight:800;color:var(--ink2);min-height:20px;}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;}
.hud-l{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:12px;}
.hp{display:flex;align-items:center;gap:8px;}
.hp svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.hpbar{position:relative;width:clamp(130px,26vw,230px);height:14px;border-radius:999px;background:rgba(20,12,28,.62);box-shadow:inset 0 0 0 1.5px rgba(255,243,230,.14);overflow:hidden;}
.hpbar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;transform-origin:left center;}
.hpbar .lag{background:rgba(255,243,230,.8);transition:transform .45s ease .12s;}
.hpbar .fill{background:linear-gradient(90deg,#E5484D,#FF8A62);}
.hpbar .shd{background:linear-gradient(90deg,#8FD8FF,#D8F3FF);top:auto;height:5px;}
#hpTxt{font-size:13px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;min-width:60px;}
.pas{display:flex;gap:6px;margin-top:8px;}
.pi{position:relative;width:36px;height:36px;border-radius:12px;background:rgba(20,12,28,.6);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,243,230,.1);transition:box-shadow .2s;}
.pi img{width:30px;height:30px;}
.pi .cd{position:absolute;inset:0;border-radius:12px;background:conic-gradient(rgba(12,7,18,.68) calc(var(--c,0)*1turn),transparent 0);}
.pi .n{position:absolute;right:-4px;bottom:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--mus);color:#3A220B;font-size:10.5px;font-weight:900;display:grid;place-items:center;}
.pi.on{box-shadow:inset 0 0 0 2px var(--mus),0 0 12px rgba(246,185,59,.45);}
.hud-c{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center;}
#waveTxt{font-family:"Luckiest Guy",var(--font);font-size:21px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.35);}
#waveSub{font-size:12px;color:var(--ink2);font-weight:800;margin-top:1px;text-shadow:0 1px 2px rgba(0,0,0,.5);}
#bossBar{margin-top:6px;width:min(360px,56vw);}
#bossName{font-size:12px;font-weight:900;color:#FFB4B6;display:block;margin-bottom:4px;text-shadow:0 1px 2px rgba(0,0,0,.6);}
.bb{height:9px;border-radius:99px;background:rgba(20,12,28,.66);overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,243,230,.12);}
.bb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#B76DFF,#E5484D);transform-origin:left center;}
.hud-r{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:12px;display:flex;gap:8px;align-items:center;pointer-events:auto;}
.hud-sk{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));bottom:22px;display:flex;align-items:flex-end;gap:12px;}

/* touch */

/* banner, hint, toast */
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;z-index:12;pointer-events:none;opacity:0;}
#banner b{display:block;font-family:"Luckiest Guy",var(--font);font-size:clamp(34px,7vw,62px);letter-spacing:.01em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.28);}

#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--ink2);background:rgba(20,12,28,.66);padding:9px 15px;border-radius:14px;z-index:9;pointer-events:none;transition:opacity .8s;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;text-align:center;line-height:1.5;width:max-content;max-width:min(92vw,560px);}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:55;pointer-events:none;}
#fx.block{pointer-events:auto;}

/* pause / result */
.mcard{width:min(360px,100%);background:var(--plum2);border-radius:26px;border:1.5px solid var(--line);padding:22px 20px 20px;text-align:center;animation:pop .3s cubic-bezier(.2,.9,.3,1.18);box-shadow:0 20px 50px rgba(0,0,0,.5);}

.cheat-in{display:block;width:100%;margin:16px 0 0;padding:13px 14px;border-radius:15px;border:1.5px solid var(--line);background:rgba(14,9,22,.55);color:var(--ink);font:inherit;font-size:17px;font-weight:800;text-align:center;letter-spacing:.05em;outline:none;-webkit-appearance:none;appearance:none;}

@keyframes shkx{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

/* ---------- 타이틀 로고 ---------- */

  -webkit-mask:radial-gradient(circle,#000 6%,transparent 62%);mask:radial-gradient(circle,#000 6%,transparent 62%);animation:rvspin 60s linear infinite;}

/* 시작 버튼: 반짝임 스윕 + 숨쉬기 */

#wvBar{display:block;width:min(180px,42vw);height:6px;margin:5px auto 0;border-radius:99px;background:rgba(20,12,28,.6);box-shadow:inset 0 0 0 1.5px rgba(255,243,230,.1);overflow:hidden;}

#combo{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-60%);text-align:right;pointer-events:none;z-index:11;--cc:#FFF3E6;}

/* ---------- 보스 시네마틱 ---------- */
#bossCine{position:absolute;inset:0;z-index:13;pointer-events:none;overflow:hidden;}
#bossCine .bc-bar{position:absolute;left:0;right:0;height:0;background:#0C0612;transition:height .35s cubic-bezier(.3,1,.4,1);}
#bossCine .bc-bar.t{top:0}#bossCine .bc-bar.b{bottom:0}
#bossCine.on .bc-bar{height:12vh;}
#bossCine.out .bc-bar{height:0;transition-duration:.45s;}
#bossCine .bc-warn{position:absolute;left:0;right:0;height:34px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;font-family:"Luckiest Guy",var(--font);font-size:18px;letter-spacing:.14em;color:#241A33;background:repeating-linear-gradient(-45deg,#F6B93B 0 18px,#FFD36B 18px 36px);opacity:0;}
#bossCine .bc-warn.t{top:calc(12vh - 17px);transform:rotate(-2deg);}
#bossCine .bc-warn.b{bottom:calc(12vh - 17px);transform:rotate(-2deg);}
#bossCine .bc-warn span{display:inline-block;padding-right:40px;animation:warnRun 1.4s linear infinite;}
#bossCine .bc-warn.b span{animation-direction:reverse;}
@keyframes warnRun{to{transform:translateX(-100%)}}
#bossCine.on .bc-warn{animation:warnIn .3s ease .15s forwards;}
#bossCine.out .bc-warn{animation:none;opacity:0;transition:opacity .25s;}
@keyframes warnIn{to{opacity:1}}
#bossCine .bc-slash{position:absolute;left:-10%;right:-10%;top:50%;height:clamp(110px,24vh,170px);translate:0 -50%;transform:rotate(-4deg) scaleX(0);background:linear-gradient(90deg,transparent,rgba(120,16,24,.92) 12%,rgba(60,8,20,.95) 50%,rgba(120,16,24,.92) 88%,transparent);box-shadow:0 0 0 3px rgba(255,120,100,.25);}
#bossCine.on .bc-slash{animation:slashIn .4s cubic-bezier(.2,1,.3,1) .25s forwards;}
#bossCine.out .bc-slash{animation:slashOut .35s ease forwards;}
@keyframes slashIn{to{transform:rotate(-4deg) scaleX(1)}}
@keyframes slashOut{from{transform:rotate(-4deg) scaleX(1)}to{transform:rotate(-4deg) scaleX(1) translateX(120%);opacity:0}}
#bossCine .bc-card{position:absolute;left:50%;top:50%;translate:-50% -50%;display:flex;align-items:center;gap:clamp(10px,3vw,22px);opacity:0;}
#bossCine.on .bc-card{animation:cardIn .5s cubic-bezier(.2,1.4,.4,1) .45s forwards;}
#bossCine.out .bc-card{animation:cardOut .3s ease forwards;}
@keyframes cardIn{0%{opacity:0;transform:translateX(-80px) skewX(-12deg)}100%{opacity:1;transform:none}}
@keyframes cardOut{from{opacity:1}to{opacity:0;transform:translateX(80px) skewX(-12deg)}}
#bossCine .bc-card img{width:clamp(88px,20vh,150px);height:auto;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px rgba(255,90,80,.55));animation:bcBob 1.2s ease-in-out infinite;}
@keyframes bcBob{50%{transform:translateY(-6px) scale(1.03)}}
#bossCine .bc-tx{display:flex;flex-direction:column;align-items:flex-start;}
#bossCine .bc-tx small{font-family:"Luckiest Guy",var(--font);font-size:clamp(12px,2.2vw,16px);letter-spacing:.2em;color:#FFB4B6;}
#bossCine .bc-tx b{font-size:clamp(30px,6.4vw,58px);line-height:1.05;color:#FFF3E6;-webkit-text-stroke:2px #241A33;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 30px rgba(255,90,80,.5);white-space:nowrap;}
#bossCine .bc-tx em{font-style:normal;font-size:clamp(14px,2.6vw,20px);color:#FFD36B;margin-top:2px;}
#bossCine.phase .bc-slash{background:linear-gradient(90deg,transparent,rgba(70,20,110,.94) 12%,rgba(30,8,60,.96) 50%,rgba(70,20,110,.94) 88%,transparent);box-shadow:0 0 0 3px rgba(200,140,255,.3);}
#bossCine.phase .bc-tx b{text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 30px rgba(190,110,255,.7);}
#bossCine.phase .bc-tx small{color:#E3C4FF;}
#bossCine.phase .bc-card img{filter:drop-shadow(0 8px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px rgba(190,110,255,.7));}
#bossCine.defeat .bc-slash{background:linear-gradient(90deg,transparent,rgba(150,96,10,.92) 12%,rgba(90,52,6,.96) 50%,rgba(150,96,10,.92) 88%,transparent);box-shadow:0 0 0 3px rgba(255,214,90,.35);}
#bossCine.defeat .bc-tx b{color:#FFE08A;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 30px rgba(255,200,80,.7);}
#bossCine.defeat .bc-tx small{color:#FFE9B0;}
#bossCine.defeat .bc-card img{filter:grayscale(.4) brightness(.8) drop-shadow(0 8px 0 rgba(0,0,0,.35));transform:rotate(-12deg);animation:none;}
#bossCine .bc-flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%);opacity:0;}
#bossCine.on .bc-flash{animation:rvfl .6s ease-out .25s;}

/* ---------- 결과 화면 ---------- */
.rs-grade{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 2px;}
.rs-grade .g{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;font-family:"Luckiest Guy",var(--font);font-size:50px;color:#fff;-webkit-text-stroke:2px #241A33;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.35);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 5px 0 rgba(0,0,0,.3);animation:gradeIn .6s cubic-bezier(.2,1.8,.4,1) .2s both;}
.rs-grade .g.S{background:linear-gradient(160deg,#FFE27A,#F59A1B);}
.rs-grade .g.A{background:linear-gradient(160deg,#D2A2FF,#8E3FD0);}
.rs-grade .g.B{background:linear-gradient(160deg,#8FD0FF,#3A88D8);}
.rs-grade .g.C{background:linear-gradient(160deg,#9BE08A,#3F9A4A);}
.rs-grade .g.D{background:linear-gradient(160deg,#C2B6C8,#7A6A82);}
.rs-grade .gt{text-align:left;}
.rs-grade .gt b{display:block;font-size:18px;}
.rs-grade .gt small{display:block;font-size:12.5px;color:var(--ink3);font-family:var(--font-b);}
@keyframes gradeIn{0%{transform:scale(3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.rs-row{animation:fadeUp .35s ease both;}
.rs-row:nth-child(1){animation-delay:.3s}.rs-row:nth-child(2){animation-delay:.38s}.rs-row:nth-child(3){animation-delay:.46s}.rs-row:nth-child(4){animation-delay:.54s}.rs-row:nth-child(5){animation-delay:.62s}.rs-row:nth-child(6){animation-delay:.7s}
.rs-rows{max-height:42vh;overflow:auto;}

/* ---------- 뽑기 v3 : 승급 연출 + 컷인 ---------- */
.rv2.v3 .rv-spot{position:absolute;left:50%;top:-20%;width:120vmin;height:150%;translate:-50% 0;background:radial-gradient(ellipse at 50% 0,rgba(255,240,200,.16),transparent 60%);pointer-events:none;animation:spotIn .8s ease both;}
@keyframes spotIn{from{opacity:0}to{opacity:1}}
.rv2.v3 .cap.hint .c-shell::after{content:"";position:absolute;right:6%;top:6%;width:22%;aspect-ratio:1;background:conic-gradient(from 45deg,transparent 0 20%,#fff 25%,transparent 30% 45%,#fff 50%,transparent 55% 70%,#fff 75%,transparent 80% 95%,#fff 100%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:hintTw 1.8s ease-in-out infinite;animation-delay:var(--bd);z-index:3;}
@keyframes hintTw{0%,70%,100%{transform:scale(0) rotate(0);opacity:0}80%{transform:scale(1.2) rotate(40deg);opacity:1}}
.rv2.v3 .cap .c-seam{transition:background .15s,box-shadow .15s;}
.rv2.v3 .cap.up .c-shell{animation:tierUp .32s cubic-bezier(.3,1.8,.5,1);}
@keyframes tierUp{0%{scale:1.32}100%{scale:1.04}}
.rv2.v3 .cap .c-tier{position:absolute;left:50%;top:-14%;translate:-50% 0;z-index:4;font-family:"Luckiest Guy",var(--font);font-size:11px;letter-spacing:.06em;padding:2px 7px 1px;border-radius:7px;background:var(--rc);color:#241A33;box-shadow:0 2px 0 rgba(0,0,0,.35);opacity:0;pointer-events:none;white-space:nowrap;}
.rv2.v3 .cap.tg .c-tier{animation:tierTag .5s cubic-bezier(.3,1.8,.5,1) forwards;}
.rv2.v3 .cap.open .c-tier{opacity:0 !important;animation:none;}
@keyframes tierTag{0%{opacity:0;transform:translateY(8px) scale(.4)}100%{opacity:1;transform:none}}
.rv-grid2.n1 .cap .c-tier{font-size:15px;padding:3px 10px 2px;}
.rv2.v3 .cap.open.r3 .c-item img{animation:legGlow 1.4s ease-in-out infinite;}
@keyframes legGlow{50%{filter:drop-shadow(0 6px 6px rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(255,200,60,.95))}}
.rv-cut{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--rc) 40%,#140A1E),#0B0612 72%);cursor:pointer;animation:cutIn .3s ease both;overflow:hidden;pointer-events:auto;}
.rv-cut.out{animation:cutOut .26s ease forwards;}
@keyframes cutIn{from{opacity:0}to{opacity:1}}
@keyframes cutOut{to{opacity:0;transform:scale(1.06)}}
.rv-cut .ct-rays{position:absolute;left:50%;top:44%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 46%,transparent) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 46%);mask:radial-gradient(circle,#000 0,transparent 46%);animation:rvspin 12s linear infinite;}
.rv-cut.r3 .ct-rays{animation-duration:7s;}
.rv-cut .ct-burst{position:absolute;left:50%;top:44%;width:70vmin;height:70vmin;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,#fff 0,color-mix(in srgb,var(--rc) 70%,transparent) 22%,transparent 62%);animation:ctBurst .7s ease-out both;}
@keyframes ctBurst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.3);opacity:.55}}
.rv-cut .ct-en{position:relative;display:flex;gap:2px;font-family:"Luckiest Guy",var(--font);font-size:clamp(30px,8vw,64px);letter-spacing:.04em;color:var(--rc);-webkit-text-stroke:2.5px #241A33;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.4),0 0 30px var(--rc);}
.rv-cut .ct-en i{font-style:normal;display:inline-block;animation:ctLet .5s cubic-bezier(.3,1.9,.5,1) both;animation-delay:calc(var(--i)*.045s + .15s);}
@keyframes ctLet{0%{transform:translateY(-60px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.rv-cut .ct-item{position:relative;width:min(46vmin,280px);aspect-ratio:1;display:grid;place-items:center;animation:ctItem .8s cubic-bezier(.2,1.7,.4,1) .1s both;}
.rv-cut .ct-item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35)) drop-shadow(0 0 26px var(--rc));animation:ctFloat 2s ease-in-out infinite .9s;}
@keyframes ctItem{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
@keyframes ctFloat{50%{transform:translateY(-10px) rotate(2deg)}}
.rv-cut .ct-info{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;animation:fadeUp .4s ease .5s both;}
.rv-cut .ct-rar{font-size:13px;padding:3px 12px 2px;border-radius:99px;background:var(--rc);color:#241A33;box-shadow:0 3px 0 rgba(0,0,0,.35);}
.rv-cut .ct-info b{font-size:clamp(24px,5.4vw,38px);color:#FFF3E6;-webkit-text-stroke:1.5px #241A33;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.4);}
.rv-cut .ct-info em{font-style:normal;font-size:15px;color:#FFE08A;}
.rv-cut .ct-tap{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--ink3);animation:tapBlink 1.2s ease-in-out infinite 1s;opacity:0;}
@keyframes tapBlink{50%{opacity:1}}
.rv-cut.r3 .ct-item img{animation:ctFloat 2s ease-in-out infinite .9s,legGlow 1.2s ease-in-out infinite;}
.rv2.v3 .rv-head b{font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.35);}
.rv2.v3 .rv-head.best3 b{color:#FFE08A;animation:cbHot .5s ease-in-out infinite alternate;--cc:#FFC93D;}
.rv2.v3 .rv-head.best2 b{color:#E3C4FF;}

@media (prefers-reduced-motion:reduce){
  .lt,.lg-drip g,.lg-tw path,.lg-burst,#btnStart,#btnStart::after,.rv-cut .ct-rays,.rv-cut .ct-item img,#combo b{animation:none !important;}
  .lg-ket .kz-o,.lg-ket .kz-i{stroke-dashoffset:0;animation:none;}
}
